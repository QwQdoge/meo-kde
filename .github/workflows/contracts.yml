name: Source contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out MeoKDE
        uses: actions/checkout@v6
        with:
          path: meo-kde
          submodules: recursive

      - name: Check out MeoUI contract source
        uses: actions/checkout@v6
        with:
          repository: QwQdoge/MeoUI
          ref: main
          path: meo-ui

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check Pillow PySide6

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Verify headless Qt SVG rendering
        working-directory: meo-kde
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QGuiApplication, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer

          app = QGuiApplication.instance() or QGuiApplication(["meo-svg-ci"])
          source = Path("assets/icons/application-identities/org.meo.settings.svg").resolve()
          renderer = QSvgRenderer(str(source))
          assert renderer.isValid(), f"QtSvg rejected {source}"
          image = QImage(256, 256, QImage.Format_ARGB32_Premultiplied)
          image.fill(Qt.transparent)
          painter = QPainter(image)
          renderer.render(painter)
          painter.end()
          assert any(image.pixelColor(x, y).alpha() for x, y in ((128, 128), (96, 74), (160, 128))), "SVG rendered fully transparent"
          print("QtSvg headless rendering OK:", source)
          PY

      - name: Check shell syntax
        working-directory: meo-kde
        run: |
          bash -n bootstrap.sh
          bash -n install.sh
          bash -n setup/apply-meo-desktop.sh
          bash -n setup/reset-meo-desktop.sh
          bash -n setup/apply-meo-system.sh
          bash -n setup/reset-meo-system.sh
          bash -n scripts/sync-to-workspace.sh
          bash -n tools/input-method/meo-input-method.sh
          bash -n tools/theme/apply-meo-mode.sh
          bash -n tools/theme/apply-meo-desktop.sh
          bash -n tools/shell/apply-meo-panel-layout.sh


      - name: Check session-lock shell syntax
        working-directory: meo-kde
        run: |
          bash -n lockscreen/meo-lock
          bash -n lockscreen/meo-lockscreen-launch
          bash -n tools/lockscreen/build-package.sh

      - name: Run source contract suites
        working-directory: meo-kde
        run: |
          python -m unittest discover -s tests/icons -p 'test_*.py'
          python -m unittest discover -s tests/theme -p 'test_*.py'
          python -m unittest discover -s tests/input_method -p 'test_*.py'
          python -m unittest discover -s tests/system -p 'test_*.py'
          python -m unittest discover -s tests/shell -p 'test_*.py'
          python -m unittest discover -s tests/widgets -p 'test_*.py'
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software python -m unittest discover -s tests/authentication -p 'test_*.py'
          python -m unittest tests.test_licensing

      - name: Validate JSON metadata
        working-directory: meo-kde
        shell: bash
        run: |
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(find plasmoids themes -name metadata.json -type f | sort)
