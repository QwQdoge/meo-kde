name: Native system build

on:
  pull_request:
    paths:
      - 'native/system/**'
      - 'native/dynamic-color/**'
      - 'native/third_party/**'
      - 'native/translations/**'
      - 'translations/**'
      - '.github/workflows/native-system-build.yml'
  push:
    branches:
      - main
    paths:
      - 'native/system/**'
      - 'native/dynamic-color/**'
      - 'native/third_party/**'
      - 'native/translations/**'
      - 'translations/**'
      - '.github/workflows/native-system-build.yml'

permissions:
  contents: read

concurrency:
  group: native-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Arch native/system build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 25

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel cmake ninja git extra-cmake-modules glibc-locales \
            qt6-base qt6-declarative qt6-tools qt6-shadertools \
            kconfig kcoreaddons kguiaddons ki18n kirigami \
            networkmanager-qt bluez-qt solid pulseaudio-qt \
            libplasma plasma-workspace
          locale -a | grep -qi '^zh_CN\.utf8$'

      - name: Check out MeoKDE
        uses: actions/checkout@v6

      - name: Check out MeoUI QML sources
        uses: actions/checkout@v6
        with:
          repository: QwQdoge/MeoUI
          ref: main
          path: deps/MeoUI

      - name: Configure
        run: >-
          cmake --fresh -S native/system -B build/native-system -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DCMAKE_INSTALL_PREFIX=/tmp/meo-native-install

      - name: Build
        run: cmake --build build/native-system --parallel 2

      - name: Install staged runtime
        run: cmake --install build/native-system

      - name: Verify staged runtime
        run: |
          test -f /tmp/meo-native-install/lib/qt6/qml/Meo/System/qmldir
          test -f /tmp/meo-native-install/lib/qt6/qml/Meo/System/libmeosystemplugin.so
          test -f /tmp/meo-native-install/share/locale/zh_CN/LC_MESSAGES/meo-desktop.mo

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export QML_IMPORT_PATH="/tmp/meo-native-install/lib/qt6/qml:$PWD/deps/MeoUI"
          export QML2_IMPORT_PATH="$QML_IMPORT_PATH"
          export XDG_DATA_DIRS="/tmp/meo-native-install/share:/usr/local/share:/usr/share"
          ctest --test-dir build/native-system --output-on-failure --timeout 60
