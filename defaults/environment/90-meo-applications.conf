# Apply the Meo Qt Widgets style to new application processes. KDE's own
# widgetStyle setting is authoritative; this bridge covers non-KDE Qt apps.
QT_STYLE_OVERRIDE=Meo

# Plasma Wayland starts the Meo-managed Fcitx 5 instance through KWin's
# Virtual Keyboard path. Native Qt/GTK Wayland clients should use text-input,
# so do not globally force QT_IM_MODULE or GTK_IM_MODULE here. XMODIFIERS keeps
# the XIM fallback available to XWayland applications. User environment.d
# configuration can override this default when another input framework is used.
XMODIFIERS=@im=fcitx

# LibreOffice owns its VCL widget renderer. The KF6 backend is the supported
# route for consuming the KDE palette and native desktop integration.
SAL_USE_VCLPLUGIN=kf6
