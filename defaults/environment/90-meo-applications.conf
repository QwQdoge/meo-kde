# Apply the Meo Qt Widgets style to new application processes. KDE's own
# widgetStyle setting is authoritative; this bridge covers non-KDE Qt apps.
QT_STYLE_OVERRIDE=Meo

# LibreOffice owns its VCL widget renderer. The KF6 backend is the supported
# route for consuming the KDE palette and native desktop integration.
SAL_USE_VCLPLUGIN=kf6
