# Qt 6 resolves MeoUI dynamically as an importable shared QML module.  The
# Meo Desktop installer refreshes and rebuilds it from the sibling project.
QML_IMPORT_PATH=${HOME}/.local/share/meo-kde/qml
QML2_IMPORT_PATH=${HOME}/.local/share/meo-kde/qml
QT_PLUGIN_PATH=${HOME}/.local/lib/qt6/plugins:/usr/lib/qt6/plugins
QT_STYLE_OVERRIDE=Meo
# LibreOffice uses its own VCL widgets rather than QStyle. Its KF6 backend is
# the supported bridge for the active KDE palette and native file dialogs.
SAL_USE_VCLPLUGIN=kf6
