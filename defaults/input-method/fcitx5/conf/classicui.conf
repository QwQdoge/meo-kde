# Meo's Fcitx 5 Classic UI presentation defaults.  This file belongs in
# /etc/xdg so an existing user-level classicui.conf always takes precedence.
# Candidate orientation, fonts, paging and engine behaviour remain Fcitx's
# own defaults; Meo only supplies the light/dark capsule themes. Fcitx addon
# configuration keys live at the document root, not in an INI section.
Theme=MeoInputMethod-Light
DarkTheme=MeoInputMethod-Dark
UseDarkTheme=True
