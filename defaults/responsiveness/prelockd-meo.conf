# Optional conservative profile. Install as /etc/prelockd.conf only after the
# user enables Meo's advanced memory-resilience option.
$LOCK_PATH_REGEX=^(/usr/bin/|/usr/lib/)
$MAX_FILE_SIZE_MIB=32
$MAX_TOTAL_SIZE_MIB=160
$MAX_TOTAL_SIZE_PERCENT=2
$VERBOSITY=1
$POLL_INTERVAL_SEC=300
$LOCK_ONLY_CRITICAL=True
@CRITICAL_NAME_LIST  kwin_wayland, kwin_x11, plasmashell, kded6, dbus-broker, pipewire, pipewire-pulse
